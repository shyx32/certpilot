server {
    listen 80;
    server_name test.local www.test.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.local www.test.local;

    ssl_certificate     /etc/nginx/certs/test.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/test.local/privkey.pem;

    location / {
        return 200 "certpilot integration target\n";
        add_header Content-Type text/plain;
    }
}
